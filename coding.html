    <nav class="topnav">

    </nav>

  <!-- ── Page body ────────────────────────── -->
  <div class="page-wrap">

    <main id="main-content" class="content" tabindex="-1">

      <section id="coding">
        <h2>Bird Code</h2>
        <p class="section-note">GitHub projects &mdash; <a href="https://github.com/hydrospheric0" target="_blank" rel="noopener noreferrer">github.com/hydrospheric0</a></p>

        <div class="filter-group">
          <span class="filter-label">Code</span>
          <div class="project-filters">
            <button class="project-pill active" data-group="code" data-filter="">All</button>
            <button class="project-pill" data-group="code" data-filter="My code">My code</button>
            <button class="project-pill fork-pill" data-group="code" data-filter="Fork">Fork</button>
            <button class="project-pill" data-group="code" data-filter="JavaScript">JavaScript</button>
            <button class="project-pill" data-group="code" data-filter="R">R</button>
            <button class="project-pill" data-group="code" data-filter="HTML">HTML</button>
          </div>
        </div>
        <div class="filter-group filter-group--last">
          <span class="filter-label">Theme</span>
          <div class="project-filters">
            <button class="project-pill active" data-group="theme" data-filter="">All</button>
            <button class="project-pill" data-group="theme" data-filter="Birds">Birds</button>
            <button class="project-pill" data-group="theme" data-filter="CBC">CBC</button>
            <button class="project-pill" data-group="theme" data-filter="eBird">eBird</button>
            <button class="project-pill" data-group="theme" data-filter="maps">Maps</button>
            <button class="project-pill" data-group="theme" data-filter="mapping">Mapping</button>
            <button class="project-pill" data-group="theme" data-filter="Rarities">Rarities</button>
            <button class="project-pill" data-group="theme" data-filter="weather">Weather</button>
          </div>
        </div>

        <div id="codingCardsContainer"></div>

      </section>

    </main>
  </div><!-- /.page-wrap -->

  <script>
    renderCodingCards('codingCardsContainer');

    let activeCode = '', activeTheme = '';
    const codingContainer = document.getElementById('codingCardsContainer');
    Array.from(codingContainer.querySelectorAll('.project-card')).forEach((card, index) => {
      card.dataset.order = String(index);
    });

    function restoreOriginalOrder() {
      const cards = Array.from(codingContainer.querySelectorAll('.project-card'));
      cards
        .sort((left, right) => Number(left.dataset.order) - Number(right.dataset.order))
        .forEach(card => codingContainer.appendChild(card));
    }

    function collapseHiddenExpandedCards() {
      codingContainer.querySelectorAll('.project-card.project-card--expanded').forEach(card => {
        if (card.style.display === 'none') card.classList.remove('project-card--expanded');
      });
    }

    function attachExpansionHandlers() {
      codingContainer.querySelectorAll('.project-summary-name').forEach(title => {
        title.addEventListener('click', event => {
          event.preventDefault();
          const card = title.closest('.project-card');
          const isExpanded = card.classList.contains('project-card--expanded');
          restoreOriginalOrder();
          codingContainer.querySelectorAll('.project-card.project-card--expanded')
            .forEach(other => {
              other.classList.remove('project-card--expanded');
            });
          if (!isExpanded) {
            const visibleCards = Array.from(codingContainer.querySelectorAll('.project-card'))
              .filter(item => item.style.display !== 'none');
            const visibleIndex = visibleCards.indexOf(card);
            if (visibleIndex % 2 === 1) {
              codingContainer.insertBefore(card, visibleCards[visibleIndex - 1]);
            }
            card.classList.add('project-card--expanded');


          }
        });
      });
    }

    attachExpansionHandlers();

    function applyFilters() {
      document.querySelectorAll('#codingCardsContainer .project-card').forEach(card => {
        const tags = card.dataset.tags || '';
        const codeOk  = !activeCode  || tags.includes(activeCode);
        const themeOk = !activeTheme || tags.includes(activeTheme);
        card.style.display = (codeOk && themeOk) ? '' : 'none';
      });
      collapseHiddenExpandedCards();
      restoreOriginalOrder();
    }

    document.querySelectorAll('.project-pill[data-group]').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        document.querySelectorAll('.project-pill[data-group="' + group + '"]')
          .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (group === 'code') activeCode  = btn.dataset.filter;
        else                  activeTheme = btn.dataset.filter;
        applyFilters();
      });
    });
  </script>

</body>
</html>
